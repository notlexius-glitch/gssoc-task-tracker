<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="expense.css">
</head>
<body>
  <main class="expense-app">
    <p><a href="index.html">Back to Task Tracker</a></p>
    <h1>Expense Tracker</h1>

    <section class="summary" aria-label="Balance summary">
      <div><span>Balance</span><strong id="balance">$0.00</strong></div>
      <div><span>Income</span><strong id="income">$0.00</strong></div>
      <div><span>Expenses</span><strong id="expenses">$0.00</strong></div>
    </section>

    <form id="transactionForm">
      <label for="description">Description</label>
      <input id="description" name="description" type="text" maxlength="80" required>

      <label for="amount">Amount</label>
      <input id="amount" name="amount" type="number" min="0.01" step="0.01" required>

      <label for="type">Type</label>
      <select id="type" name="type">
        <option value="income">Income</option>
        <option value="expense">Expense</option>
      </select>

      <button type="submit">Add Transaction</button>
      <p id="formMessage" class="form-message" role="alert"></p>
    </form>

    <section aria-labelledby="historyHeading">
      <h2 id="historyHeading">Transaction History</h2>
      <p id="emptyState">No transactions yet.</p>
      <ul id="transactionList" class="transactions"></ul>
    </section>
  </main>
  <script src="expense.js"></script>
</body>
</html>
